<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">

<title>Mechanic Profile</title>

<script src="https://cdn.tailwindcss.com"></script>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">


<style>
body{
background:
linear-gradient(rgba(243,239,232,.70),rgba(243,239,232,.78)),
url('/static/prof.png') center center/cover fixed no-repeat;
font-family:'Segoe UI',sans-serif;
}
.overlay{
min-height:100vh;
background:linear-gradient(rgba(16,40,71,.15),rgba(16,40,71,.22));
display:flex;
align-items:center;
justify-content:center;
padding:40px 20px;
}
.glass{
width:100%;
max-width:820px;
background:rgba(228,223,214,.94);
backdrop-filter:blur(18px);
border:1px solid rgba(212,166,58,.35);
border-radius:30px;
box-shadow:0 22px 70px rgba(16,40,71,.22);
}
</style>


</head>

<body>

<div class="overlay py-12">

<form action="/updatemechanic" method="POST">

<div class="max-w-[820px] mx-auto glass rounded-3xl p-6">

    {% with messages = get_flashed_messages(with_categories=true) %}
{% if messages %}

{% for category,message in messages %}

<div id="successMsg"
class="mb-5 bg-[#2E5AAC] text-[#102847] p-3 rounded-xl text-center">

<i class="fa-solid fa-circle-check"></i>

{{message}}

</div>

{% endfor %}

{% endif %}
{% endwith %}

    <div class="flex justify-between items-center mb-4">

   <a href="/viewuserrequestspage"
       class="w-10 h-10 flex items-center justify-center rounded-full bg-[#D4A63A] text-[#102847] hover:bg-[#c8952d]">

        <i class="fa-solid fa-arrow-left"></i>

    </a>

    
    <h2 class="text-2xl text-[#D4A63A] font-bold">
        My Profile
    </h2>

    <div class="w-10"></div>

</div>

<div class="text-center">

<img
src="/static/uploads/mechimage/{{mech[6]}}"
class="w-24 h-24 rounded-full mx-auto border-[5px] border-[#D4A63A] object-cover">

<h1 class="text-3xl text-[#D4A63A] font-bold mt-3">

{{mech[1]}}

</h1>



</div>

<div class="grid md:grid-cols-2 gap-5 mt-6">

<div>
<label class="text-[#102847] font-semibold tracking-wide">Name</label>
<input type="text" name="name" value="{{mech[1]}}" class="w-full mt-2 px-4 py-3 rounded-xl bg-white border border-[#d9cdb8] text-[#102847] placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-[#2E5AAC] focus:border-[#2E5AAC] transition">
</div>

<div>
<label class="text-[#102847] font-semibold tracking-wide">Phone</label>
<input type="text" name="phone" value="{{mech[2]}}" class="w-full mt-2 px-4 py-3 rounded-xl bg-white border border-[#d9cdb8] text-[#102847] placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-[#2E5AAC] focus:border-[#2E5AAC] transition">
</div>

<div>

<label class="text-[#102847] font-semibold tracking-wide">Password</label>

<div class="relative mt-2">

<input
id="password"
type="password"
name="pass"
value="{{mech[9]}}"
class="w-full px-4 py-3 rounded-xl bg-white border border-[#d9cdb8] text-[#102847] pr-12 focus:outline-none focus:ring-2 focus:ring-[#2E5AAC]">

<button
type="button"
onclick="togglePassword()"
class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 hover:text-[#D4A63A]">

<i id="eyeIcon" class="fa-solid fa-eye"></i>

</button>

</div>

</div>

<div>
<label class="text-[#102847] font-semibold">Workshop Name</label>
<input type="text" name="sname" value="{{mech[3]}}" class="w-full mt-2 px-4 py-3 rounded-xl bg-white border border-[#d9cdb8] text-[#102847] placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-[#2E5AAC] focus:border-[#2E5AAC] transition">
</div>

<div>
<label class="text-[#102847] font-semibold">Workshop Address</label>
<input type="text" name="saddress" value="{{mech[4]}}" class="w-full mt-2 px-4 py-3 rounded-xl bg-white border border-[#d9cdb8] text-[#102847] placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-[#2E5AAC] focus:border-[#2E5AAC] transition">
</div>

<div>
<label class="text-[#102847] font-semibold">Alternate Phone</label>
<input type="text" name="altphone" value="{{mech[5]}}" class="w-full mt-2 px-4 py-3 rounded-xl bg-white border border-[#d9cdb8] text-[#102847] placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-[#2E5AAC] focus:border-[#2E5AAC] transition">
</div>


<div class="col-span-2 flex justify-center">

    <a href="/static/uploads/certificates/{{ mech[7] }}"
       target="_blank"
       class="bg-[#2E5AAC] hover:bg-[#244d97] text-[#102847] px-3 py-2 rounded-xl font-semibold">
        <i class="fa-solid fa-eye"></i>
        View Workshop Certificate
    </a>

</div>

</div>
<div class="mt-8 flex justify-center w-full">

    <button
        type="submit"
        class="w-56 py-3 bg-[#D4A63A] hover:bg-[#c8952d] text-[#102847] rounded-xl font-bold text-lg transition shadow-lg">

        <i class="fa-solid fa-floppy-disk mr-2"></i>
        Update Profile

    </button>

</div>

</div>

<!-- Certificate Modal -->

<div
id="certificateModal"
class="fixed inset-0 hidden bg-black/80 items-center justify-center">

<button
onclick="closeCertificate()"
class="absolute top-5 right-8 text-[#102847] text-5xl">

&times;

</button>

<img
id="certificateImage"
class="max-w-[700px] max-h-[80vh] rounded-xl">

</div>

<script>

function showCertificate(img){

    document.getElementById("certificateImage").src =
    "/static/uploads/certificates/" + img;

    document.getElementById("certificateModal").classList.remove("hidden");
    document.getElementById("certificateModal").classList.add("flex");

}

function closeCertificate(){

    document.getElementById("certificateModal").classList.remove("flex");
    document.getElementById("certificateModal").classList.add("hidden");

}

// Close modal when clicking outside the image
document.getElementById("certificateModal").addEventListener("click", function(e){

    if(e.target === this){
        closeCertificate();
    }

});

// Close modal with ESC key
document.addEventListener("keydown", function(e){

    if(e.key === "Escape"){
        closeCertificate();
    }

});

</script>

</div>


</form>

<script>

function togglePassword(){

const password=document.getElementById("password");
const eye=document.getElementById("eyeIcon");

if(password.type==="password"){

password.type="text";

eye.classList.remove("fa-eye");
eye.classList.add("fa-eye-slash");

}
else{

password.type="password";

eye.classList.remove("fa-eye-slash");
eye.classList.add("fa-eye");

}

}

setTimeout(function(){

let msg=document.getElementById("successMsg");

if(msg){

msg.style.opacity="0";

setTimeout(function(){

msg.remove();

},500);

}

},3000);

</script>
<script>
const modal = document.getElementById("certificateModal");

modal.addEventListener("click", function(e) {

    if (e.target === modal) {
        closeCertificate();
    }

});
</script>
</body>

</html>
