<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<title>Feedback</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" rel="stylesheet"/>
<style>
body{background:linear-gradient(rgba(10,22,40,.5),rgba(10,22,40,.5)),url('/static/feed1.png') center right/cover fixed no-repeat;min-height:100vh;font-family:'Segoe UI',sans-serif}
.overlay{min-height:100vh}
.glass{background:rgba(248,245,240,.94);backdrop-filter:blur(18px);border:1px solid rgba(212,166,58,.18);box-shadow:0 20px 55px rgba(0,0,0,.22)}
select,textarea{background:#fff!important;color:#102847!important;border:1px solid #d8d2c5}
label{color:#102847!important;font-weight:700}
textarea::placeholder{color:#64748b}
.star{font-size:42px;color:#c8c8c8;cursor:pointer;transition:.25s}.star.active{color:#D4A63A;transform:scale(1.2)}
</style>
</head>
<body>
<div class="overlay">
<!-- Navbar -->
<nav class="fixed top-0 left-0 w-full bg-[#102847]/95 backdrop-blur-xl border-b border-[#D4A63A]/20 shadow-xl z-50">
<div class="max-w-7xl mx-auto flex justify-between items-center px-8 py-4">
<div class="text-3xl font-bold text-yellow-400"><div class="flex items-center gap-3 text-3xl font-bold"><div class="w-11 h-11 rounded-full bg-[#D4A63A] flex items-center justify-center"><i class="fa-solid fa-screwdriver-wrench text-[#102847]"></i></div><span style="color:white">Road</span><span style="color:#D4A63A">Assist</span></div></div>
<div class="space-x-3">
<a class="text-gray-200 hover:text-[#D4A63A]" href="addtravelpage">
            Add Travel
          </a>
<a class="text-gray-200 hover:text-[#D4A63A]" href="service_request">
            Service Request
          </a>
<a class="text-gray-200 hover:text-[#D4A63A]" href="myrequests">
            My Requests
          </a>
<a class="text-gray-200 hover:text-[#D4A63A]" href="uviewmytravelspage">
            My Travels
          </a>
<a class="bg-[#D4A63A] text-[#102847] px-5 py-2 rounded-full font-bold" href="feedbackpage">
            Feedback
          </a>
<!--<a href="emergency" class="text-white hover:text-yellow-400">
            Emergency
          </a>-->
<a class="text-red-300 hover:text-red-200" href="/">
            Logout
          </a>
</div>
</div>
</nav>
<!-- Feedback Form -->
<div class="flex justify-center items-center min-h-screen pt-24 px-6">
<div class="glass rounded-[30px] shadow-2xl p-8 w-full max-w-xl">
<div class="text-center">
<div class="w-20 h-20 bg-[#102847] rounded-full mx-auto flex items-center justify-center">
<i class="fa-solid fa-star text-4xl text-[#D4A63A]"></i>
</div>
<h1 class="text-4xl font-extrabold text-[#102847] mt-5">

            Rate Your Mechanic

          </h1>
<p class="text-gray-600 mt-3">

            Your feedback helps improve our roadside assistance service.

          </p>
</div>
<div class="text-center text-red-300 font-semibold mt-5">

          {% for message in get_flashed_messages() %}
          {{message}}
          {% endfor %}

        </div>
<form action="savefeedback" class="mt-8" method="POST">
<!-- Mechanic -->
<div>
<label class="text-white font-semibold">
<i class="fa-solid fa-user-gear text-yellow-400"></i>

              Select Mechanic

            </label>
<select class="w-full mt-2 p-4 rounded-xl border border-gray-400" name="mid" required="">

              {% for r in res %}

              <option value="{{r[0]}}">

                {{r[1]}} - {{r[3]}}

              </option>

              {% endfor %}

            </select>
</div>
<!-- Rating -->
<div class="mt-8 text-center">
<label class="text-white font-semibold text-xl">

              Rate Your Experience

            </label>
<div class="mt-4">
<span class="star" onclick="setRating(1)">★</span>
<span class="star" onclick="setRating(2)">★</span>
<span class="star" onclick="setRating(3)">★</span>
<span class="star" onclick="setRating(4)">★</span>
<span class="star" onclick="setRating(5)">★</span>
</div>
<p class="text-yellow-400 mt-3 font-bold" id="ratingText">

              Select Rating

            </p>
<input id="output" name="star" type="hidden"/>
</div>
<!-- Review -->
<div class="mt-8">
<label class="text-white font-semibold">
<i class="fa-solid fa-comment text-yellow-400"></i>

              Write Your Review

            </label>
<textarea class="w-full mt-2 p-4 rounded-xl border border-gray-400" name="description" placeholder="Share your experience..." required="" rows="5"></textarea>
</div>
<button class="w-full mt-8 bg-[#102847] hover:bg-[#183a64] text-white font-bold py-4 rounded-xl text-lg transition" type="submit">
<i class="fa-solid fa-paper-plane"></i>

            Submit Feedback

          </button>
</form>
</div>
</div>
</div>
<script>

    const stars = document.querySelectorAll(".star");

    const output = document.getElementById("output");

    const rating = document.getElementById("ratingText");

    const text = [
      "",
      "Poor",
      "Fair",
      "Good",
      "Very Good",
      "Excellent"
    ];

    function setRating(n) {

      output.value = n;

      rating.innerHTML = n + "/5 - " + text[n];

      stars.forEach((star, index) => {

        if (index < n) {

          star.classList.add("active");

        }

        else {

          star.classList.remove("active");

        }

      });

    }

  </script>
</body>
</html>
