<!DOCTYPE html>

<html lang="en">

<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>User Registration</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" rel="stylesheet"/>
<style>@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Manrope:wght@400;500;600;700&display=swap');
body{font-family:'Manrope',sans-serif;background:#F3EFE8;min-height:100vh}
.overlay{background:linear-gradient(90deg,rgba(243,239,232,.92),rgba(243,239,232,.75),rgba(243,239,232,.35),transparent),url('/static/hero-mechanic.png') right center/cover no-repeat;min-height:100vh}
.glass{background:rgba(255,255,255,.92);backdrop-filter:blur(18px);border:1px solid #e5ddd0;border-radius:28px;box-shadow:0 20px 50px rgba(16,40,71,.12)}
input,select,textarea{background:#fff!important;color:#1f2937!important;border:1px solid #d6d3d1!important}
label{color:#102847!important;font-weight:600}
input::placeholder,textarea::placeholder{color:#9ca3af}
</style>
</head>

<body>
<div class="overlay">
<!-- Navbar -->
<nav class="fixed top-0 left-0 w-full z-50 bg-white/75 backdrop-blur-xl shadow-lg border-b border-[#E5DED2]">
<div class="max-w-7xl mx-auto px-8 py-4 flex justify-between items-center">
<div class="text-3xl font-bold text-yellow-400"><div class="flex items-center gap-3 text-4xl font-black"><div class="w-12 h-12 rounded-full bg-[#102847] flex items-center justify-center"><i class="fa-solid fa-screwdriver-wrench text-[#D4A63A]"></i></div><div><span class="text-[#102847]">Road</span><span class="text-[#D4A63A]">Assist</span></div></div></div>
<div class="space-x-3">
<a class="text-[#102847] hover:text-[#D4A63A] px-5 py-2 rounded-full font-semibold duration-300" href="/">
            Home
          </a>
<a class="text-[#102847] hover:text-[#D4A63A] px-5 py-2 rounded-full font-semibold duration-300" href="userregisterpage">
            User Register
          </a>
<a class="text-[#102847] hover:text-[#D4A63A] px-5 py-2 rounded-full font-semibold duration-300" href="mechregisterpage">
            Mechanic Register
          </a>
<a class="text-[#102847] hover:text-[#D4A63A] px-5 py-2 rounded-full font-semibold duration-300" href="allfeedbacks">
            Feedback
          </a>
<a class="text-[#102847] hover:text-[#D4A63A] px-5 py-2 rounded-full font-semibold duration-300" href="selftroubleshoot">
            Self Troubleshoot
          </a>
<a class="text-[#102847] hover:bg-red-600 hover:text-white px-5 py-2 rounded-full font-semibold duration-300" href="emergency">
    Emergency Help
</a>
</div>
</div>
</nav>
<div class="pt-20 pb-6">
<div class="max-w-2xl mx-auto px-4">
<div class="glass p-10">
<h1 class="text-5xl font-bold text-center text-[#102847] mb-2">
<i class="fa-solid fa-user-plus"></i>
            User Registration
          </h1>
<p class="text-center text-gray-200 text-sm mb-4">
            Create your account to request roadside assistance anytime.
          </p>
<div class="text-center text-red-300 mb-5 font-semibold">
            {% for message in get_flashed_messages() %}
            {{message}}
            {% endfor %}
          </div>
<form action="userregister" enctype="multipart/form-data" method="POST">
<div class="grid md:grid-cols-2 gap-x-5 gap-y-3">
<div>
<label class="block text-sm mb-1">
                  Full Name
                </label>
<input class="mt-1 w-full rounded-xl px-4 py-3 text-sm" name="name" required="" type="text"/>
</div>
<div>
<label class="block text-sm mb-1">
                  Email
                </label>
<input class="mt-1 w-full rounded-xl px-4 py-3 text-sm" name="email" required="" type="email"/>
</div>
<div>
<label class="block text-sm mb-1">
                  Phone Number
                </label>
<input class="mt-1 w-full rounded-xl px-4 py-3 text-sm" id="phone" name="phone" onchange="validatephno()" required="" type="number"/>
</div>
<div>
<label class="block text-sm mb-1">
                  Gender
                </label>
<select class="mt-1 w-full rounded-xl px-4 py-3 text-sm" name="gender">
<option>Male</option>
<option>Female</option>
</select>
</div>
<div class="md:col-span-2">
<label class="block text-sm mb-1">
                  Address
                </label>
<textarea class="mt-1 w-full rounded-xl px-4 py-3 text-sm" name="address" required="" rows="2"></textarea>
</div>
<div>
<label class="block text-sm mb-1">
                  Car Number
                </label>
<input class="mt-1 w-full rounded-xl px-4 py-3 text-sm" name="carnum" placeholder="KA01AB1234" type="text"/>
</div>
<div>
<label class="block text-sm mb-1">
                  Bike Number
                </label>
<input class="mt-1 w-full rounded-xl px-4 py-3 text-sm" name="bikenum" placeholder="KA01XY9876" type="text"/>
</div>
<div>
<label class="block text-sm mb-1">
                  Insurance Policy Number
                </label>
<input class="mt-1 w-full rounded-xl px-4 py-3 text-sm" name="policenum" required="" type="number"/>
</div>
<div>
<label class="block text-sm mb-1">
                  Driving License Image
                </label>
<input accept="image/*" class="mt-1 w-full rounded-xl px-4 py-3 text-sm" name="dlimage" required="" type="file"/>
</div>
<div>
<label class="block text-sm mb-1">
                  Password
                </label>
<input class="mt-1 w-full rounded-xl px-4 py-3 text-sm" minlength="8" name="password" pattern="^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&amp;]).{8,}$" required="" title="Password must contain at least 8 characters, one uppercase letter, one lowercase letter, one number and one special character." type="password"/>
</div>
</div>
<div class="text-center mt-6">
<button class="bg-[#102847] hover:bg-[#1E3A5F] text-white font-semibold px-10 py-3 rounded-full transition" type="submit">
<i class="fa-solid fa-user-check"></i>

                Register

              </button>
</div>
</form>
</div>
</div>
</div>
</div>
<script>

    function validatephno() {

      var ph = document.getElementById("phone").value;

      if (ph.length != 10) {

        alert("Invalid Phone Number");

        document.getElementById("phone").value = "";

      }

    }

    function validatephno2() {

      var ph = document.getElementById("gnum").value;

      if (ph.length != 10) {

        alert("Invalid Guardian Phone Number");

        document.getElementById("gnum").value = "";

      }

    }

  </script>

</body>

</html>
