<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Login</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" rel="stylesheet"/>
<style>
@import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap');
*{font-family:Manrope,sans-serif}
body{
background:linear-gradient(rgba(243,239,232,.58),rgba(243,239,232,.58)),url('/static/log.png') center/cover no-repeat fixed;
min-height:100vh}
.overlay{min-height:100vh}
.glass{background:rgba(255,255,255,.92);backdrop-filter:blur(18px);border:1px solid rgba(212,166,58,.25);box-shadow:0 20px 55px rgba(16,40,71,.18)}
input,select{background:#fff!important;color:#102847!important;border:1px solid #d7d2c7}
input::placeholder{color:#64748b}
</style>
</head>

<body>
<div class="overlay">
<!-- ================= NAVBAR ================= -->
<nav class="fixed top-0 left-0 w-full z-50 bg-[#F3EFE8]/95 backdrop-blur-xl shadow">
<div class="max-w-7xl mx-auto px-8 py-4 flex justify-between items-center">
<div class="text-3xl font-bold text-yellow-400"><div class="flex items-center gap-3 text-3xl font-extrabold"><div class="w-11 h-11 rounded-full bg-[#102847] flex items-center justify-center"><i class="fa-solid fa-screwdriver-wrench text-[#D4A63A]"></i></div><span style="color:#102847">Road</span><span style="color:#D4A63A">Assist</span></div></div>
<div class="space-x-3">
<a class="text-[#102847] hover:text-[#D4A63A] px-5 py-2 rounded-full font-semibold duration-300" href="/">
            Home
          </a>
<a class="text-[#102847] hover:text-[#D4A63A] px-5 py-2 rounded-full font-semibold duration-300" href="userregisterpage">
            User Register
          </a>
<a class="text-[#102847] hover:text-[#D4A63A] px-5 py-2 rounded-full font-semibold duration-300" href="mechregisterpage">
            Mechanic Register
          </a>
<a class="text-[#102847] hover:text-[#D4A63A] px-5 py-2 rounded-full font-semibold duration-300" href="allfeedbacks">
            Feedback
          </a>
<a class="text-[#102847] hover:text-[#D4A63A] px-5 py-2 rounded-full font-semibold duration-300" href="selftroubleshoot">
            Self Troubleshoot
          </a>
<a class="text-white bg-red-600 hover:bg-red-700 px-5 py-2 rounded-full font-semibold" href="emergency">
    Emergency Help
</a>
</div>
</div>
</nav>
<!-- ================= LOGIN ================= -->
<div class="flex items-center justify-center min-h-screen px-5 pt-20">
<div class="glass w-full max-w-md rounded-3xl p-8">
<div class="text-center">
<div class="w-24 h-24 rounded-full bg-[#102847] mx-auto flex items-center justify-center">
<i class="fa-solid fa-user-lock text-4xl text-[#D4A63A]"></i>
</div>
<h1 class="text-5xl font-extrabold text-[#102847] mt-5">

            Login

          </h1>
<p class="text-gray-900 text-sm mt-1">

            Login to access your dashboard.

          </p>
</div>
<!-- Flash Message -->
<div class="text-center text-red-600 font-semibold mt-5">

          {% for message in get_flashed_messages() %}

          {{message}}

          {% endfor %}

        </div>
<form action="login" class="mt-5" method="POST">
<!-- Login Type -->
<div>
<label class="block text-[#102847] text-sm font-semibold mb-2">

              Login Type

            </label>
<select class="w-full mt-1 px-3 py-2 rounded-lg border border-gray-400 text-sm" id="loginType" name="ltype" onchange="changeLabel()">
<option value="admin">ADMIN</option>
<option value="mechanic">MECHANIC</option>
<option value="user">USER</option>
</select>
</div>
<!-- Email / Phone -->
<div class="mt-5">
<label class="block text-[#102847] text-sm font-semibold mb-2" id="selectedOptionLabel">

              Email

            </label>
<div class="relative mt-1">
<span class="absolute left-3 top-2.5 text-yellow-400">
<i class="fa-solid fa-envelope"></i>
</span>
<input "="" class="w-full pl-10 pr-3 py-2 rounded-lg border border-gray-400 text-sm" id="email" name="email" required="" type="text"/>
</div>
</div>
<!-- Password -->
<div class="mt-5">
<label class="block text-[#102847] text-sm font-semibold mb-2">

              Password

            </label>
<div class="relative mt-1">
<span class="absolute left-3 top-2.5 text-yellow-400">
<i class="fa-solid fa-lock"></i>
</span>
<input class="w-full pl-10 pr-10 py-2 rounded-lg border border-gray-400 text-sm" id="password" name="password" required="" type="password"/>
<button class="absolute right-3 top-2.5 text-yellow-400" onclick="togglePassword()" type="button">
<i class="fa-solid fa-eye" id="eyeIcon"></i>
</button>
</div>
</div>
<!-- Login Button -->
<button class="w-full mt-7 bg-[#102847] hover:bg-[#183a64] text-white font-semibold py-3 rounded-full" type="submit">
<i class="fa-solid fa-right-to-bracket"></i>

            Login

          </button>
<div class="text-center mt-4">
<a class="text-[#D4A63A] hover:text-[#b88923] font-semibold" href="forgotpass">

              Forgot Password?

            </a>
</div>
</form>
</div>
</div>
</div>
<script>

    function changeLabel() {

      var type = document.getElementById("loginType").value;

      var label = document.getElementById("selectedOptionLabel");

      var icon = document.querySelector(".fa-envelope,.fa-phone");

      if (type == "mechanic") {

        label.innerHTML = "Phone Number";

        document.querySelector(".relative span i").className = "fa-solid fa-phone";

      }

      else {

        label.innerHTML = "Email";

        document.querySelector(".relative span i").className = "fa-solid fa-envelope";

      }

    }

    function togglePassword() {

      var pass = document.getElementById("password");

      var eye = document.getElementById("eyeIcon");

      if (pass.type === "password") {

        pass.type = "text";

        eye.className = "fa-solid fa-eye-slash";

      }

      else {

        pass.type = "password";

        eye.className = "fa-solid fa-eye";

      }

    }

  </script>
</body>
</html>
